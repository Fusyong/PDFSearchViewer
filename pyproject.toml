[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfsearchviewer"
version = "0.1.0"
description = "PDF text search with style filters and hit comparison grid for prepress checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24.0",
  "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
packaging = ["pyinstaller>=6.3"]

[project.scripts]
pdfsearchviewer = "pdfsearchviewer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
